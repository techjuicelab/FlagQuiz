  <style>
    .rw-root {
      font-family: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }
    .rw-root, .rw-root * {
      box-sizing: border-box;
    }

    @keyframes rw-confetti {
      0% {
        transform: translateY(-60px) rotate(0deg);
        opacity: 0;
      }
      8% {
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        transform: translateY(900px) rotate(620deg);
        opacity: 0;
      }
    }
    @keyframes rw-banner {
      0% {
        transform: translateY(-170px) rotate(-4deg);
        opacity: 0;
      }
      62% {
        transform: translateY(10px) rotate(1.5deg);
        opacity: 1;
      }
      82% {
        transform: translateY(-5px) rotate(-1deg);
      }
      100% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
    }
    @keyframes rw-shake {
      0% {
        transform: translateX(0) rotate(0deg);
      }
      20% {
        transform: translateX(-6px) rotate(-3deg);
      }
      45% {
        transform: translateX(6px) rotate(3deg);
      }
      70% {
        transform: translateX(-4px) rotate(-2deg);
      }
      100% {
        transform: translateX(0) rotate(0deg);
      }
    }
    @keyframes rw-lid {
      0% {
        transform: rotate(0deg);
      }
      70% {
        transform: rotate(-48deg);
      }
      100% {
        transform: rotate(-42deg);
      }
    }
    @keyframes rw-glow {
      0% {
        transform: scale(0.3);
        opacity: 0;
      }
      55% {
        transform: scale(1.06);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 0.9;
      }
    }
    @keyframes rw-breathe {
      0% {
        opacity: 0.6;
      }
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0.6;
      }
    }
    @keyframes rw-fade-in {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }
    @keyframes rw-spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    @keyframes rw-pop-out {
      0% {
        transform: translateY(90px) scale(0.35);
        opacity: 0;
      }
      45% {
        opacity: 1;
      }
      62% {
        transform: translateY(-18px) scale(1.1);
      }
      82% {
        transform: translateY(6px) scale(0.97);
      }
      100% {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }
    @keyframes rw-bob {
      0% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-7px);
      }
      100% {
        transform: translateY(0);
      }
    }
    @keyframes rw-star-pop {
      0% {
        transform: scale(0.2) rotate(-40deg);
        opacity: 0;
      }
      50% {
        transform: scale(1.3) rotate(8deg);
        opacity: 1;
      }
      74% {
        transform: scale(0.92) rotate(-3deg);
      }
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 1;
      }
    }
    @keyframes rw-rise {
      0% {
        transform: translateY(26px);
        opacity: 0;
      }
      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }
    @keyframes rw-btn-glow {
      0% {
        box-shadow: 0 10px 24px rgba(59, 95, 224, 0.34);
      }
      50% {
        box-shadow: 0 16px 34px rgba(59, 95, 224, 0.52);
      }
      100% {
        box-shadow: 0 10px 24px rgba(59, 95, 224, 0.34);
      }
    }
    @keyframes rw-sparkle {
      0% {
        transform: translateY(6px) scale(0.7);
        opacity: 0;
      }
      40% {
        transform: translateY(-6px) scale(1.1);
        opacity: 1;
      }
      100% {
        transform: translateY(-20px) scale(0.8);
        opacity: 0;
      }
    }

    .rw-confetti-piece {
      animation: rw-confetti 3.4s linear infinite;
    }
    .rw-banner {
      animation: rw-banner 1s cubic-bezier(0.2, 0.9, 0.3, 1.25) 0.15s both;
    }
    .rw-caption {
      animation: rw-rise 0.6s ease-out 0.9s both;
    }
    .rw-chest {
      animation: rw-shake 0.42s ease-in-out 0.5s 3;
    }
    .rw-lid {
      animation: rw-lid 0.9s cubic-bezier(0.2, 0.9, 0.3, 1.2) 1.45s both;
    }
    .rw-glow {
      animation: rw-glow 1.1s ease-out 1.55s both, rw-breathe 2.6s ease-in-out 2.6s infinite;
    }
    .rw-rays-fade {
      animation: rw-fade-in 1s ease-out 1.6s both;
    }
    .rw-rays-spin {
      animation: rw-spin 16s linear 1.6s infinite;
    }
    .rw-pop {
      animation: rw-pop-out 0.95s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
    }
    .rw-bob {
      animation: rw-bob 3s ease-in-out infinite;
    }
    .rw-star-on {
      animation: rw-star-pop 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.4) both;
    }
    .rw-rise {
      animation: rw-rise 0.6s ease-out both;
    }
    .rw-btn {
      animation: rw-rise 0.6s ease-out 3.5s both, rw-btn-glow 2.4s ease-in-out 4.1s infinite;
    }
    .rw-sparkle {
      animation: rw-sparkle 2.4s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
