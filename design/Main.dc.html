<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>게임형 퀴즈 화면</title>
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    .fq-root, .fq-root * {
      box-sizing: border-box;
      font-family: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      word-break: keep-all;
    }

    /* ---- 등장 애니메이션 ---- */
    @keyframes fq-drop-in {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fq-rise-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fq-card-bounce {
      0%   { opacity: 0; transform: translateY(90px) scale(.86); }
      55%  { opacity: 1; transform: translateY(-16px) scale(1.04); }
      75%  { transform: translateY(6px) scale(.99); }
      90%  { transform: translateY(-3px) scale(1.005); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fq-dot-pop {
      0%   { opacity: 0; transform: scale(.4); }
      70%  { opacity: 1; transform: scale(1.25); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* ---- 계속 도는 애니메이션 ---- */
    @keyframes fq-float {
      0%   { transform: translateY(0) rotate(-.6deg); }
      50%  { transform: translateY(-9px) rotate(.6deg); }
      100% { transform: translateY(0) rotate(-.6deg); }
    }
    @keyframes fq-xp-fill {
      from { width: 0%; }
      to   { width: 68%; }
    }
    @keyframes fq-combo-fill {
      from { width: 0%; }
      to   { width: 60%; }
    }
    @keyframes fq-shine {
      0%   { transform: translateX(-120%); }
      60%  { transform: translateX(320%); }
      100% { transform: translateX(320%); }
    }
    @keyframes fq-pulse {
      0%   { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,183,3,.55); }
      55%  { transform: scale(1.09); box-shadow: 0 0 0 10px rgba(255,183,3,0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,183,3,0); }
    }
    @keyframes fq-flicker {
      0%   { transform: translateY(0) scale(1); opacity: .95; }
      50%  { transform: translateY(-2px) scale(1.14); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: .95; }
    }
    @keyframes fq-twinkle {
      0%   { transform: scale(1) rotate(0deg); opacity: 1; }
      50%  { transform: scale(1.18) rotate(12deg); opacity: .82; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes fq-nudge {
      0%   { transform: translateX(0); }
      50%  { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }
    @keyframes fq-ring {
      0%   { box-shadow: 0 0 0 0 rgba(79,124,255,.45); }
      70%  { box-shadow: 0 0 0 8px rgba(79,124,255,0); }
      100% { box-shadow: 0 0 0 0 rgba(79,124,255,0); }
    }
    @keyframes fq-glow {
      0%   { opacity: .35; transform: scale(1); }
      50%  { opacity: .7; transform: scale(1.06); }
      100% { opacity: .35; transform: scale(1); }
    }

    /* ---- 누르는 느낌 (정지 화면이라 CSS 로만) ---- */
    .fq-choice {
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease, background .14s ease;
    }
    .fq-choice:hover {
      transform: translateY(-2px);
      border-color: #4f7cff;
      box-shadow: 0 14px 40px rgba(31,41,55,.16);
    }
    .fq-choice:active {
      transform: translateY(3px) scale(.985);
      box-shadow: 0 2px 6px rgba(31,41,55,.14);
      background: #f8fafc;
    }
    .fq-choice:hover .fq-choice-num {
      background: #4f7cff;
      color: #ffffff;
    }
    .fq-small {
      transition: transform .14s ease, box-shadow .14s ease, background .14s ease;
    }
    .fq-small:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(31,41,55,.14);
    }
    .fq-small:active {
      transform: translateY(2px) scale(.98);
      box-shadow: 0 2px 5px rgba(31,41,55,.12);
      background: #f8fafc;
    }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>
<div class="fq-root" style="width: 390px; min-height: 844px; background: #eef4ff; color: #1f2937; padding: 18px 20px 16px 20px; display: flex; flex-direction: column; gap: 10px; overflow: hidden;">

  <div style="background: #ffffff; border-radius: 20px; box-shadow: 0 6px 18px rgba(31,41,55,.10); padding: 14px; display: flex; flex-direction: column; gap: 10px; animation: fq-drop-in .5s cubic-bezier(.2,.8,.3,1) both;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
      <div style="height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 8px; border-radius: 999px; background: linear-gradient(135deg, #4f7cff, #3b5fe0); box-shadow: 0 6px 18px rgba(31,41,55,.10);">
        <span style="height: 22px; min-width: 22px; border-radius: 999px; background: rgba(255,255,255,.22); color: #ffffff; font-size: 12px; font-weight: 900; display: flex; align-items: center; justify-content: center; padding: 0 6px;">4</span>
        <span style="color: #ffffff; font-size: 13px; font-weight: 800; letter-spacing: -.02em;">나침반 탐험가</span>
      </div>
      <div style="height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; background: rgba(255,183,3,.14); border: 1px solid rgba(255,183,3,.45);">
        <span style="font-size: 13px; display: inline-flex; animation: fq-twinkle 2.4s ease-in-out infinite;">⭐</span>
        <span style="font-size: 13px; font-weight: 900; color: #1f2937;">17</span>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
        <span style="font-size: 12px; font-weight: 800; color: #6b7280; letter-spacing: -.02em;">민규의 경험치</span>
        <span style="font-size: 12px; font-weight: 900; color: #3b5fe0;">340 / 500</span>
      </div>
      <div style="height: 14px; border-radius: 999px; background: #e5e7eb; overflow: hidden; position: relative;">
        <div style="height: 100%; width: 68%; border-radius: 999px; background: linear-gradient(90deg, #4f7cff, #3b5fe0); position: relative; overflow: hidden; animation: fq-xp-fill 1.5s cubic-bezier(.2,.8,.3,1) both;">
          <div style="position: absolute; top: 0; left: 0; width: 34%; height: 100%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.75), rgba(255,255,255,0)); animation: fq-shine 2.6s ease-in-out 1.5s infinite;"></div>
        </div>
      </div>
    </div>
  </div>

  <div style="background: linear-gradient(135deg, rgba(255,183,3,.10), rgba(255,183,3,.26)), #ffffff; border: 1px solid rgba(255,183,3,.45); border-radius: 20px; box-shadow: 0 6px 18px rgba(31,41,55,.10); padding: 10px 12px; display: flex; align-items: center; gap: 10px; animation: fq-drop-in .5s cubic-bezier(.2,.8,.3,1) .1s both;">
    <div style="width: 40px; height: 40px; flex: 0 0 40px; border-radius: 999px; background: linear-gradient(135deg, #ffb703, #ef4444); display: flex; align-items: center; justify-content: center; font-size: 20px; animation: fq-pulse 1.8s ease-in-out infinite;">🔥</div>
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 5px; min-width: 0;">
      <span style="font-size: 13px; font-weight: 900; color: #1f2937; letter-spacing: -.02em;">3연속! 보물상자까지 두 걸음</span>
      <div style="height: 8px; border-radius: 999px; background: #ffffff; overflow: hidden;">
        <div style="height: 100%; width: 60%; border-radius: 999px; background: #ffb703; animation: fq-combo-fill 1.6s cubic-bezier(.2,.8,.3,1) .3s both;"></div>
      </div>
      <div style="display: flex; align-items: center; gap: 4px;">
        <span style="font-size: 10px; display: inline-flex; animation: fq-flicker 1.2s ease-in-out 0s infinite;">🔥</span>
        <span style="font-size: 10px; display: inline-flex; animation: fq-flicker 1.2s ease-in-out .12s infinite;">🔥</span>
        <span style="font-size: 10px; display: inline-flex; animation: fq-flicker 1.2s ease-in-out .24s infinite;">🔥</span>
        <span style="font-size: 10px; display: inline-flex; filter: grayscale(1); opacity: .4;">🔥</span>
        <span style="font-size: 10px; display: inline-flex; filter: grayscale(1); opacity: .4;">🔥</span>
        <span style="font-size: 10px; font-weight: 800; color: #6b7280;">최고 9연속</span>
      </div>
    </div>
    <div style="flex: 0 0 auto; display: flex; align-items: center; gap: 2px; animation: fq-nudge 1.6s ease-in-out infinite;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h13"></path>
        <path d="M13 6l6 6-6 6"></path>
      </svg>
      <span style="font-size: 22px;">🎁</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 2px; animation: fq-drop-in .5s cubic-bezier(.2,.8,.3,1) .16s both;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
      <span style="font-size: 12px; font-weight: 800; color: #6b7280; letter-spacing: -.02em;">지금 4번째 문제예요</span>
      <span style="font-size: 12px; font-weight: 900; color: #6b7280;">4 / 10</span>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <span style="flex: 1 1 0; height: 12px; border-radius: 999px; background: #4f7cff; animation: fq-dot-pop .4s ease-out 0s both;"></span>
      <span style="flex: 1 1 0; height: 12px; border-radius: 999px; background: #4f7cff; animation: fq-dot-pop .4s ease-out .05s both;"></span>
      <span style="flex: 1 1 0; height: 12px; border-radius: 999px; background: #4f7cff; animation: fq-dot-pop .4s ease-out .1s both;"></span>
      <span style="flex: 1.6 1 0; height: 12px; border-radius: 999px; background: #ffb703; border: 2px solid #ffffff; animation: fq-ring 1.8s ease-out .5s infinite;"></span>
      <span style="flex: 1 1 0; height: 12px; border-radius: 999px; background: #e5e7eb;"></span>
      <span style="flex: 1 1 0; height: 12px; border-radius: 999px; background: #e5e7eb;"></span>
      <span style="flex: 1 1 0; height: 12px; border-radius: 999px; background: #e5e7eb;"></span>
      <span style="flex: 1 1 0; height: 12px; border-radius: 999px; background: #e5e7eb;"></span>
      <span style="flex: 1 1 0; height: 12px; border-radius: 999px; background: #e5e7eb;"></span>
      <span style="flex: 1 1 0; height: 12px; border-radius: 999px; background: #e5e7eb;"></span>
    </div>
  </div>

  <div style="animation: fq-card-bounce .9s cubic-bezier(.22,1.15,.36,1) .18s both;">
    <div style="background: #ffffff; border-radius: 20px; box-shadow: 0 14px 40px rgba(31,41,55,.16); padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <span style="font-size: 16px; line-height: 22px; font-weight: 900; color: #1f2937; letter-spacing: -.03em; text-align: center;">이 국기는 어느 나라 국기일까요?</span>
      <div style="animation: fq-float 5.5s ease-in-out 1.1s infinite; display: flex; align-items: center; justify-content: center; position: relative;">
        <div style="position: absolute; width: 138px; height: 24px; border-radius: 999px; background: rgba(79,124,255,.18); filter: blur(7px); bottom: -14px; animation: fq-glow 5.5s ease-in-out 1.1s infinite;"></div>
        <div style="width: 144px; height: 96px; border-radius: 12px; background: #ffffff; border: 1px solid #e5e7eb; box-shadow: 0 6px 18px rgba(31,41,55,.10); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;">
          <div style="width: 58px; height: 58px; border-radius: 999px; background: #bc002d;"></div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 12px; border-radius: 999px; background: #f8fafc; border: 1px solid #e5e7eb;">
        <span style="font-size: 11px;">🚩</span>
        <span style="font-size: 11px; font-weight: 800; color: #6b7280; letter-spacing: -.02em;">아시아 · 섬나라예요</span>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px;">
    <div class="fq-choice" style="min-height: 60px; border-radius: 16px; background: #ffffff; border: 2px solid #e5e7eb; box-shadow: 0 6px 18px rgba(31,41,55,.10); display: flex; align-items: center; gap: 12px; padding: 0 16px; cursor: pointer; animation: fq-rise-in .42s cubic-bezier(.2,.8,.3,1) .34s both;">
      <span class="fq-choice-num" style="width: 30px; height: 30px; flex: 0 0 30px; border-radius: 12px; background: #eef4ff; color: #3b5fe0; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center;">1</span>
      <span style="font-size: 17px; font-weight: 800; color: #1f2937; letter-spacing: -.02em;">일본</span>
    </div>
    <div class="fq-choice" style="min-height: 60px; border-radius: 16px; background: #ffffff; border: 2px solid #e5e7eb; box-shadow: 0 6px 18px rgba(31,41,55,.10); display: flex; align-items: center; gap: 12px; padding: 0 16px; cursor: pointer; animation: fq-rise-in .42s cubic-bezier(.2,.8,.3,1) .4s both;">
      <span class="fq-choice-num" style="width: 30px; height: 30px; flex: 0 0 30px; border-radius: 12px; background: #eef4ff; color: #3b5fe0; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center;">2</span>
      <span style="font-size: 17px; font-weight: 800; color: #1f2937; letter-spacing: -.02em;">베트남</span>
    </div>
    <div class="fq-choice" style="min-height: 60px; border-radius: 16px; background: #ffffff; border: 2px solid #e5e7eb; box-shadow: 0 6px 18px rgba(31,41,55,.10); display: flex; align-items: center; gap: 12px; padding: 0 16px; cursor: pointer; animation: fq-rise-in .42s cubic-bezier(.2,.8,.3,1) .46s both;">
      <span class="fq-choice-num" style="width: 30px; height: 30px; flex: 0 0 30px; border-radius: 12px; background: #eef4ff; color: #3b5fe0; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center;">3</span>
      <span style="font-size: 17px; font-weight: 800; color: #1f2937; letter-spacing: -.02em;">방글라데시</span>
    </div>
    <div class="fq-choice" style="min-height: 60px; border-radius: 16px; background: #ffffff; border: 2px solid #e5e7eb; box-shadow: 0 6px 18px rgba(31,41,55,.10); display: flex; align-items: center; gap: 12px; padding: 0 16px; cursor: pointer; animation: fq-rise-in .42s cubic-bezier(.2,.8,.3,1) .52s both;">
      <span class="fq-choice-num" style="width: 30px; height: 30px; flex: 0 0 30px; border-radius: 12px; background: #eef4ff; color: #3b5fe0; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center;">4</span>
      <span style="font-size: 17px; font-weight: 800; color: #1f2937; letter-spacing: -.02em;">태국</span>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; animation: fq-rise-in .42s cubic-bezier(.2,.8,.3,1) .6s both;">
    <div class="fq-small" style="flex: 1 1 0; min-height: 52px; border-radius: 16px; background: #ffffff; border: 2px solid rgba(255,183,3,.45); box-shadow: 0 6px 18px rgba(31,41,55,.10); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
      <span style="font-size: 16px;">💡</span>
      <span style="font-size: 14px; font-weight: 900; color: #1f2937; letter-spacing: -.02em;">힌트 보기</span>
    </div>
    <div class="fq-small" style="flex: 1 1 0; min-height: 52px; border-radius: 16px; background: #ffffff; border: 2px solid #e5e7eb; box-shadow: 0 6px 18px rgba(31,41,55,.10); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;">
      <span style="font-size: 16px;">🤷</span>
      <span style="font-size: 14px; font-weight: 900; color: #6b7280; letter-spacing: -.02em;">모르겠어요</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
