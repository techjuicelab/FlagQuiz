<helmet>
  <style>
    .fqh-root, .fqh-root * {
      box-sizing: border-box;
      font-family: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      word-break: keep-all;
    }

    /* ---- 레벨 링 각도 (340/500 = 245도) ---- */
    @property --fqh-ring {
      syntax: "<angle>";
      inherits: false;
      initial-value: 0deg;
    }
    @keyframes fqh-ring-fill {
      from { --fqh-ring: 0deg; }
      to   { --fqh-ring: 245deg; }
    }

    /* ---- 등장 애니메이션 ---- */
    @keyframes fqh-drop-in {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fqh-rise-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fqh-pop-in {
      0%   { opacity: 0; transform: translateY(22px) scale(.9); }
      65%  { opacity: 1; transform: translateY(-5px) scale(1.03); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fqh-cell-pop {
      0%   { opacity: 0; transform: scale(.4); }
      70%  { opacity: 1; transform: scale(1.18); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes fqh-grow-x {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    /* ---- 계속 도는 애니메이션 ---- */
    @keyframes fqh-float {
      0%   { transform: translateY(0) rotate(-2deg); }
      50%  { transform: translateY(-4px) rotate(2deg); }
      100% { transform: translateY(0) rotate(-2deg); }
    }
    @keyframes fqh-wobble {
      0%   { transform: rotate(-6deg) scale(1); }
      25%  { transform: rotate(5deg) scale(1.05); }
      50%  { transform: rotate(-4deg) scale(1); }
      75%  { transform: rotate(6deg) scale(1.05); }
      100% { transform: rotate(-6deg) scale(1); }
    }
    @keyframes fqh-twinkle {
      0%   { transform: scale(1) rotate(0deg); opacity: 1; }
      50%  { transform: scale(1.2) rotate(14deg); opacity: .8; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes fqh-sparkle {
      0%   { opacity: .25; transform: scale(.65) rotate(0deg); }
      45%  { opacity: 1; transform: scale(1.15) rotate(45deg); }
      100% { opacity: .25; transform: scale(.65) rotate(90deg); }
    }
    @keyframes fqh-shine {
      0%   { transform: translateX(-130%) skewX(-18deg); }
      55%  { transform: translateX(430%) skewX(-18deg); }
      100% { transform: translateX(430%) skewX(-18deg); }
    }
    @keyframes fqh-pulse-ring {
      0%   { box-shadow: 0 14px 40px rgba(59,95,224,.34), 0 0 0 0 rgba(79,124,255,.45); }
      70%  { box-shadow: 0 14px 40px rgba(59,95,224,.34), 0 0 0 12px rgba(79,124,255,0); }
      100% { box-shadow: 0 14px 40px rgba(59,95,224,.34), 0 0 0 0 rgba(79,124,255,0); }
    }
    @keyframes fqh-breathe {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.02); }
      100% { transform: scale(1); }
    }
    @keyframes fqh-nudge {
      0%   { transform: translateX(0); }
      50%  { transform: translateX(4px); }
      100% { transform: translateX(0); }
    }
    @keyframes fqh-glow {
      0%   { opacity: .3; transform: scale(1); }
      50%  { opacity: .65; transform: scale(1.08); }
      100% { opacity: .3; transform: scale(1); }
    }

    /* ---- 누르는 느낌 ---- */
    .fqh-play {
      transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease, background .14s ease;
    }
    .fqh-play:hover {
      transform: translateY(-3px);
      border-color: #4f7cff;
      box-shadow: 0 14px 40px rgba(31,41,55,.16);
    }
    .fqh-play:active {
      transform: translateY(2px) scale(.985);
      box-shadow: 0 2px 6px rgba(31,41,55,.14);
      background: #f8fafc;
    }
    .fqh-play:hover .fqh-chip {
      transform: scale(1.08) rotate(-6deg);
    }
    .fqh-chip {
      transition: transform .16s ease;
    }
    .fqh-go {
      transition: transform .14s ease, filter .14s ease;
    }
    .fqh-go:hover {
      transform: translateY(-2px);
      filter: saturate(1.08);
    }
    .fqh-go:active {
      transform: translateY(3px) scale(.99);
    }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>
