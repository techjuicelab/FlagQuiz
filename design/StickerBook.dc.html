  <style>
    .fqs-root, .fqs-root * {
      box-sizing: border-box;
      font-family: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont,
        "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      word-break: keep-all;
    }

    /* ---- 등장 애니메이션 ---- */
    @keyframes fqs-drop-in {
      from { opacity: 0; transform: translateY(-12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fqs-rise-in {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fqs-pop-in {
      0%   { opacity: 0; transform: translateY(18px) scale(.93); }
      65%  { opacity: 1; transform: translateY(-4px) scale(1.03); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fqs-cell-pop {
      0%   { opacity: 0; transform: scale(.35); }
      60%  { opacity: 1; transform: scale(1.16); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes fqs-grow-x {
      from { transform: scaleX(0); }
      to   { transform: scaleX(1); }
    }

    /* ---- 계속 도는 애니메이션 ---- */
    @keyframes fqs-sparkle {
      0%   { opacity: .2; transform: scale(.65) rotate(-14deg); }
      50%  { opacity: 1;  transform: scale(1.18) rotate(12deg); }
      100% { opacity: .2; transform: scale(.65) rotate(-14deg); }
    }
    @keyframes fqs-glow {
      0%, 100% { box-shadow: 0 2px 6px rgba(31,41,55,.07), 0 0 0 0 rgba(255,183,3,0); }
      50%      { box-shadow: 0 4px 12px rgba(31,41,55,.10), 0 0 0 4px rgba(255,183,3,.30); }
    }
    @keyframes fqs-shine {
      0%   { transform: translateX(-150%) skewX(-18deg); }
      55%  { transform: translateX(260%) skewX(-18deg); }
      100% { transform: translateX(260%) skewX(-18deg); }
    }
    @keyframes fqs-shimmer {
      0%   { background-position: -130% 0; }
      100% { background-position: 230% 0; }
    }
    @keyframes fqs-float {
      0%   { transform: translateY(0) rotate(-3deg); }
      50%  { transform: translateY(-3px) rotate(3deg); }
      100% { transform: translateY(0) rotate(-3deg); }
    }
    @keyframes fqs-breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.09); }
    }
    @keyframes fqs-pulse-ring {
      0%   { box-shadow: 0 8px 20px rgba(79,124,255,.30), 0 0 0 0 rgba(79,124,255,.34); }
      70%  { box-shadow: 0 8px 20px rgba(79,124,255,.30), 0 0 0 12px rgba(79,124,255,0); }
      100% { box-shadow: 0 8px 20px rgba(79,124,255,.30), 0 0 0 0 rgba(79,124,255,0); }
    }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</helmet>
